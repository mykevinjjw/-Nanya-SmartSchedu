<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南亞技術學院 - 自動排課系統 Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --secondary: #64748b;
            --bg: #f1f5f9;
            --sidebar-bg: #0f172a;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
        
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            line-height: 1.5;
        }

        /* --- Sidebar --- */
        #sidebar { 
            width: 300px; 
            background-color: var(--sidebar-bg); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), width 0.4s;
            flex-shrink: 0;
            box-shadow: var(--shadow-lg);
            z-index: 50;
        }
        #sidebar.collapsed { width: 0; transform: translateX(-100%); overflow: hidden; }
        .sidebar-header { 
            padding: 24px; 
            font-size: 1.25rem; 
            font-weight: 800; 
            border-bottom: 1px solid #334155; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: linear-gradient(to right, #1e293b, #0f172a);
        }
        .sidebar-content { flex-grow: 1; overflow-y: auto; padding: 16px; }
        .teacher-item { 
            padding: 14px 18px; 
            margin-bottom: 10px; 
            border-radius: var(--radius); 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
        }
        .teacher-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .teacher-item.active { background: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4); border-color: var(--primary-light); }
        .teacher-hours { font-size: 0.8rem; font-weight: bold; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 20px; }

        /* --- Main Content --- */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        
        header { 
            background: var(--card-bg); 
            padding: 16px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: var(--shadow-sm); 
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 40;
        }
        .logo-area h1 { margin: 0; font-size: 1.5rem; font-weight: 900; color: var(--primary); letter-spacing: -0.5px; }
        .logo-area div { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; font-weight: 600; }

        .actions { display: flex; gap: 12px; }
        
        /* --- Buttons --- */
        button { 
            padding: 10px 20px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4); filter: brightness(1.1); }
        .btn-secondary { background: white; color: var(--text-main); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { background: var(--bg); border-color: var(--secondary); }
        .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: white; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }

        /* --- Dashboard --- */
        .dashboard-container { padding: 30px 40px; display: flex; flex-direction: column; gap: 30px; }
        
        .admin-panel { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow-md); 
        }
        
        .config-bar { 
            display: flex; 
            gap: 30px; 
            align-items: center; 
            margin-bottom: 24px; 
            padding-bottom: 20px; 
            border-bottom: 1px solid var(--border); 
        }
        .config-bar label { font-weight: 700; font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .config-bar input, .config-bar select { 
            padding: 6px 12px; 
            border-radius: 6px; 
            border: 1px solid var(--border); 
            background: var(--bg);
            font-weight: 600;
        }

        /* --- Tabs --- */
        .tabs-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab-btn { 
            padding: 10px 24px; 
            cursor: pointer; 
            border-radius: 30px; 
            font-weight: 700; 
            color: var(--text-muted); 
            border: 1px solid transparent; 
            background: transparent;
            font-size: 0.9rem;
        }
        .tab-btn:hover { color: var(--primary); background: rgba(79, 70, 229, 0.05); }
        .tab-btn.active { 
            color: var(--primary); 
            background: rgba(79, 70, 229, 0.1); 
            border-color: rgba(79, 70, 229, 0.2); 
        }

        .editor-section { 
            background: #f8fafc; 
            padding: 24px; 
            border-radius: 12px; 
            margin-bottom: 24px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            align-items: end; 
            border: 1px solid var(--border);
        }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; background: white; 
        }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .table-container { 
            max-height: 400px; 
            overflow-y: auto; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            background: white; 
        }
        table thead th { 
            background: #f8fafc; 
            padding: 14px; 
            text-align: left; 
            font-weight: 800; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            border-bottom: 2px solid var(--border); 
        }
        table td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        table tr:last-child td { border-bottom: none; }
        table tr:hover td { background-color: #f1f5f9; }

        /* --- Schedule --- */
        .schedule-section { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow-md); 
        }
        .class-badge {
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 700; font-size: 0.9rem;
        }
        .class-badge.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); }

        .schedule-grid { 
            display: grid; 
            grid-template-columns: 80px repeat(5, 1fr); 
            gap: 4px; 
            background-color: #e2e8f0; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e2e8f0;
        }
        .grid-header { background-color: #f8fafc; padding: 16px 10px; text-align: center; font-weight: 800; color: var(--text-muted); font-size: 0.9rem; }
        .grid-cell { background-color: #fff; min-height: 100px; padding: 6px; position: relative; }
        .slot-label { background-color: #f8fafc; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text-muted); font-size: 0.8rem; }
        
        .course-card { 
            background: linear-gradient(135deg, #eff6ff, #dbeafe); 
            border-left: 5px solid var(--primary); 
            padding: 10px; 
            border-radius: 8px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .course-name { font-weight: 900; font-size: 0.95rem; color: var(--primary-dark); margin-bottom: 4px; }
        .course-info { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; display: flex; flex-direction: column; gap: 2px; }
        
        .restricted { 
            background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 10px, #f1f5f9 10px, #f1f5f9 20px);
            display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-weight: 700; font-size: 0.75rem;
        }

        .toggle-btn { position: fixed; right: 30px; bottom: 30px; width: 60px; height: 60px; border-radius: 50%; z-index: 100; font-size: 1.5rem; }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .dashboard-container > div { animation: fadeIn 0.5s ease-out both; }
        .dashboard-container > div:nth-child(2) { animation-delay: 0.1s; }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* --- Print --- */
        @media print {
            body { background: white !important; overflow: visible; }
            .no-print, .toggle-btn, header, #sidebar, .admin-panel { display: none !important; }
            #main-content { overflow: visible !important; height: auto !important; width: 100% !important; }
            .dashboard-container { padding: 0 !important; margin: 0 !important; }
            .schedule-section { border: none !important; padding: 0 !important; box-shadow: none !important; }
            .schedule-grid { gap: 1px; border: 2px solid black; background-color: black; border-radius: 0; }
            .grid-header, .grid-cell { border: 1px solid black; background-color: white !important; }
            .course-card { border: 1px solid #aaa !important; background: white !important; box-shadow: none; color: black; }
            .course-name, .course-info { color: black !important; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>
    <div id="main-content">
        <header class="no-print">
            <div class="logo-area">
                <h1>🎓 南亞技術學院 排課系統 <span style="font-weight:400; color:#94a3b8; font-size:1.1rem;">PRO</span></h1>
                <div id="viewSubtitle">智慧雲端排課引擎 v2.0</div>
            </div>
            <div class="actions">
                <button class="btn-secondary" onclick="window.print()">📥 匯出課表</button>
                <button class="btn-primary" id="runBtn">🚀 一鍵自動排課</button>
            </div>
        </header>

        <div class="dashboard-container">
            <!-- 整合式資料管理區塊 -->
            <div class="admin-panel no-print">
                <div class="config-bar">
                    <label>📅 當前學期：
                        <input type="number" id="cfg_year" value="113" oninput="updatePrintTitle()"> 年
                        <select id="cfg_term" onchange="updatePrintTitle()">
                            <option value="第 1 學期">第 1 學期</option>
                            <option value="第 2 學期">第 2 學期</option>
                        </select>
                    </label>
                </div>
                
                <div class="tabs-row">
                    <div class="tab-btn active" id="tab-teachers" onclick="switchTab('teachers')">👤 老師管理</div>
                    <div class="tab-btn" id="tab-courses" onclick="switchTab('courses')">📖 課程設定</div>
                    <div class="tab-btn" id="tab-classrooms" onclick="switchTab('classrooms')">🏢 教室清單</div>
                    <div class="tab-btn" id="tab-classes" onclick="switchTab('classes')">👥 班級清單</div>
                    <div class="tab-btn" id="tab-rules" onclick="switchTab('rules')" style="color:var(--danger);">⚖️ 全校規則</div>
                    <div class="tab-btn" id="tab-import" onclick="switchTab('import')" style="color:var(--primary);">📥 CSV 匯入</div>
                </div>

                <div id="editorArea" class="editor-section"></div>
                <div class="table-container"><table id="dbTable"><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div>
                <div id="paginationArea" class="pagination"></div>
            </div>

            <!-- 課表顯示區塊 -->
            <div class="schedule-section">
                <div id="classSelector" style="margin-bottom:20px; display:flex; flex-wrap:wrap; gap:10px;"></div>
                <div id="printArea">
                    <div class="print-header"><h1>南亞技術學院</h1><h2 id="printFullTitle">...</h2></div>
                    <div id="scheduleContainer"></div>
                </div>
            </div>
        </div>

        <button class="toggle-btn no-print btn-primary" onclick="toggleSidebar()">📊</button>
    </div>

    <div id="sidebar" class="collapsed no-print">
        <div class="sidebar-header"><span>👨‍🏫 教師統計</span><button onclick="toggleSidebar()" style="background:none; color:white; font-size:1.5rem; cursor:pointer; border:none;">&times;</button></div>
        <div class="sidebar-content" id="teacherList"></div>
    </div>

    <script>
        let allSchedules = []; let allData = { teachers: [], courses: [], classrooms: [], class_groups: [], settings: {} };
        let currentClass = ""; let currentTeacher = null; let viewMode = 'class'; let currentTab = 'teachers'; let editingId = null;
        let currentPage = 1; const pageSize = 10;
        let csvRawData = "";
        const days = ["週一", "週二", "週三", "週四", "週五"];

        async function fetchData() { 
            try { 
                const res = await fetch('/course-api/data'); 
                allData = await res.json(); 
                if (!currentClass && allData.class_groups.length > 0) {
                    currentClass = allData.class_groups[0].name;
                }
                renderTeacherSidebar(); 
                renderClassSelector(); 
                updatePrintTitle(); 
                renderSchedule();
            } catch(e) { console.error(e); } 
        }
        async function fetchSchedule() { try { const res = await fetch('/course-api/schedule'); allSchedules = await res.json(); renderTeacherSidebar(); renderSchedule(); } catch(e) { console.error(e); } }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        
        function updatePrintTitle() {
            const target = viewMode === 'class' ? (currentClass || '...') : `👤 ${currentTeacher}`;
            document.getElementById('printFullTitle').innerText = `${document.getElementById('cfg_year').value} 學年度 ${document.getElementById('cfg_term').value} - ${target} 課表`;
            document.getElementById('viewSubtitle').innerText = `目前顯示：${target} 課表`;
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleContainer'); 
            let html = '<div class="schedule-grid"><div class="grid-header">節次</div>' + days.map(d => `<div class="grid-header">${d}</div>`).join('');
            for(let slot=1; slot<=9; slot++) {
                html += `<div class="grid-cell slot-label">第 ${slot} 節</div>`;
                for(let day=0; day<5; day++) {
                    const s = allData.settings || {}; let restriction = null;
                    if (day === 4 && s.friday_all_day_off) restriction = "全校禁排";
                    if (day === 3 && slot >= 5 && s.thursday_afternoon_off) restriction = "全校禁排";
                    
                    // 根據新的 9 節次邏輯調整
                    if (day === s.ge_zone_day && (s.ge_zone_slots || "").split(",").includes(slot.toString()) && viewMode === 'class') {
                        html += `<div class="grid-cell" style="background-color:#f1f5f9;"><div class="course-card" style="background:rgba(0,0,0,0.05); border-left-color:#cbd5e1;"><span class="course-name" style="color:#64748b; font-size:0.8rem;">通識時段</span></div></div>`;
                        continue;
                    }
                    const course = allSchedules.find(x => (viewMode === 'class' ? x.class_name === currentClass : x.teacher_name === currentTeacher) && x.day === day && slot >= x.slot && slot < x.slot + x.duration);
                    if (course) { 
                        const isStart = course.slot === slot; 
                        html += `<div class="grid-cell"><div class="course-card" style="${!isStart ? 'opacity:0.6; filter:grayscale(0.5);' : ''}"><span class="course-name">${course.course_name}</span><div class="course-info"><span>👤 ${course.teacher_name}</span><span>📍 ${course.room_name}</span></div></div></div>`; 
                    } else if (restriction) { 
                        html += `<div class="grid-cell restricted">${restriction}</div>`; 
                    } else { 
                        html += `<div class="grid-cell"></div>`; 
                    }
                }
            }
            container.innerHTML = html + '</div>';
        }

        document.getElementById('runBtn').onclick = async () => {
            const btn = document.getElementById('runBtn'); 
            btn.disabled = true; btn.innerText = "⏳ 正在運算中...";
            try { 
                const res = await fetch('/course-api/run-scheduler', { method: 'POST' }); 
                const data = await res.json(); 
                if (data.error) alert(data.error); 
                else { allSchedules = data; renderTeacherSidebar(); renderSchedule(); alert("✅ 排課成功！"); } 
            } catch (e) { alert("❌ 連線失敗：後端未啟動。"); } 
            finally { btn.disabled = false; btn.innerText = "🚀 一鍵自動排課"; }
        };

        function switchTab(tab) { 
            currentTab = tab; editingId = null; currentPage = 1; 
            ['teachers', 'courses', 'classrooms', 'classes', 'rules', 'import'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                if (el) el.className = 'tab-btn' + (tab === t ? ' active' : '');
            }); 
            renderEditor(); renderTable(); 
        }

        function renderEditor() {
            const area = document.getElementById('editorArea'); 
            if (currentTab === 'teachers') { 
                area.innerHTML = `<div class="form-group"><label>老師姓名</label><input type="text" id="t_name"></div><div class="form-group"><label>系主任</label><select id="t_is_dir"><option value="false">否</option><option value="true">是</option></select></div><div style="display:flex; gap:10px;"><button class="btn-primary" onclick="saveItem('teachers')">儲存資料</button></div>`; 
            } else if (currentTab === 'courses') {
                const classCheckboxes = allData.class_groups.map(g => `<label style="display:flex; align-items:center; gap:5px; font-weight:700; cursor:pointer;"><input type="checkbox" name="c_classes" value="${g.id}"> ${g.name}</label>`).join('');
                area.innerHTML = `
                    <div class="form-group"><label>課名</label><input type="text" id="c_name"></div>
                    <div class="form-group"><label>學分</label><input type="number" id="c_credits"></div>
                    <div class="form-group"><label>老師</label><select id="c_teacher">${allData.teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
                    <div class="form-group"><label>狀態</label>
                        <div style="display:flex; gap:15px; align-items:center; height:45px;">
                            <label style="display:flex; align-items:center; gap:5px; font-weight:700;"><input type="checkbox" id="c_should_schedule"> 參與排課</label>
                            <span id="c_reserved_label" style="display:none; color:var(--danger); font-weight:800; background:rgba(239, 68, 68, 0.1); padding:4px 8px; border-radius:4px;">⚠️ 保留課</span>
                        </div>
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;"><label>適用班級</label><div style="display:flex; flex-wrap:wrap; gap:15px; padding:15px; background:white; border-radius:8px; border:1px solid var(--border);">${classCheckboxes}</div></div>
                    <div class="form-group"><label>指定教室</label><select id="c_room"><option value="">自動分配</option>${allData.classrooms.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select></div>
                    <div class="form-group"><label>特許節次</label><input type="text" id="c_allowed" placeholder="例如 1,8"></div>
                    <div class="form-group"><label>希望天</label><select id="c_fday"><option value="">自動</option>${[1,2,3,4,5].map(i=>`<option value="${i}">週${days[i-1].slice(1)}</option>`).join('')}</select></div>
                    <div class="form-group"><label>希望節</label><select id="c_fslot"><option value="">自動</option>${[1,2,3,4,5,6,7,8].map(i=>`<option value="${i}">第 ${i} 節</option>`).join('')}</select></div>
                    <div style="display:flex; gap:10px; grid-column: 1 / -1;"><button class="btn-primary" onclick="saveItem('courses')">儲存課程</button></div>`;
            } else if (currentTab === 'classrooms') { 
                area.innerHTML = `<div class="form-group"><label>教室名稱</label><input type="text" id="r_name"></div><div style="display:flex; gap:10px;"><button class="btn-primary" onclick="saveItem('classrooms')">新增教室</button></div>`; 
            } else if (currentTab === 'classes') { 
                area.innerHTML = `<div class="form-group"><label>班級名稱</label><input type="text" id="g_name"></div><div style="display:flex; gap:10px;"><button class="btn-primary" onclick="saveItem('classes')">新增班級</button></div>`; 
            } else if (currentTab === 'rules') {
                const s = allData.settings || {};
                area.innerHTML = `
                    <div class="form-group"><label>週四下午禁排</label><select id="r_thurs"><option value="true" ${s.thursday_afternoon_off?'selected':''}>開啟</option><option value="false" ${!s.thursday_afternoon_off?'selected':''}>關閉</option></select></div>
                    <div class="form-group"><label>週五全天禁排</label><select id="r_fri"><option value="true" ${s.friday_all_day_off?'selected':''}>開啟</option><option value="false" ${!s.friday_all_day_off?'selected':''}>關閉</option></select></div>
                    <div class="form-group"><label>通識專用天</label><input type="number" id="r_ge_day" value="${(s.ge_zone_day || 0) + 1}"></div>
                    <div class="form-group"><label>通識專用節</label><input type="text" id="r_ge_slots" value="${s.ge_zone_slots || '5,6,7,8'}"></div>
                    <div class="form-group"><label>系主任禁排節</label><input type="text" id="r_dir_slots" value="${s.director_off_slots || '1,2,3,4'}"></div>
                    <div class="form-group"><label>特定節次限制</label><select id="r_mid_en"><option value="true" ${s.midweek_limit_enabled?'selected':''}>啟用</option><option value="false" ${!s.midweek_limit_enabled?'selected':''}>停用</option></select></div>
                    <div style="display:flex; gap:10px; grid-column: 1 / -1;"><button class="btn-primary" onclick="saveSettings()">💾 儲存全校規則</button></div>`;
            } else if (currentTab === 'import') {
                area.innerHTML = `
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>批量 CSV 檔案上傳</label>
                        <div style="display:flex; gap:15px; align-items:center; background:white; padding:20px; border:2px dashed var(--border); border-radius:12px;">
                            <input type="file" id="csv_file" accept=".csv" onchange="handleFileSelect(event)">
                            <button class="btn-primary" id="do_import_btn" onclick="doImportCSV()" disabled>🚀 開始匯入資料</button>
                        </div>
                    </div>`;
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { csvRawData = e.target.result; renderCSVPreview(csvRawData); document.getElementById('do_import_btn').disabled = false; };
            reader.readAsText(file);
        }

        function renderCSVPreview(csv) {
            const rows = csv.split('\n').filter(r => r.trim());
            const head = document.getElementById('tableHead'); const body = document.getElementById('tableBody');
            head.innerHTML = '<th>類別</th><th>名稱</th><th>屬性1</th><th>屬性2</th><th>屬性3</th>';
            body.innerHTML = rows.slice(0, 10).map(r => `<tr>${r.split(',').map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
            document.getElementById('paginationArea').innerHTML = '<span style="color:var(--primary); font-weight:800;">🔍 檔案預覽 (僅顯示前 10 筆)</span>';
        }

        async function doImportCSV() {
            if (!confirm("匯入將清空現有資料，確定嗎？")) return;
            const res = await fetch('/course-api/import-csv', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text: csvRawData }) });
            const result = await res.json();
            if (result.ok) { alert("✅ 匯入成功！"); fetchData(); switchTab('teachers'); }
        }

        function renderTable() {
            if (currentTab === 'import') return;
            const head = document.getElementById('tableHead'); const body = document.getElementById('tableBody');
            const paginator = document.getElementById('paginationArea');
            if (currentTab === 'rules') { head.innerHTML = ''; body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px;">請在上方設定規則。</td></tr>'; paginator.innerHTML = ''; return; }
            
            let data = (currentTab === 'teachers' ? allData.teachers : currentTab === 'courses' ? allData.courses : currentTab === 'classrooms' ? allData.classrooms : allData.class_groups);
            data.sort((a, b) => a.id - b.id);
            const totalPages = Math.ceil(data.length / pageSize) || 1;
            const start = (currentPage - 1) * pageSize;
            const paged = data.slice(start, start + pageSize);

            if (currentTab === 'teachers') {
                head.innerHTML = '<th>ID</th><th>姓名</th><th>系主任</th><th>管理</th>';
                body.innerHTML = paged.map(t => `<tr><td>${t.id}</td><td><b>${t.name}</b></td><td>${t.is_director?'🌟 是':'否'}</td><td><button class="btn-secondary" onclick="setEdit('teachers',${t.id})">編輯</button></td></tr>`).join('');
            } else if (currentTab === 'courses') {
                head.innerHTML = '<th>ID</th><th>課名</th><th>學分</th><th>管理</th>';
                body.innerHTML = paged.map(c => `<tr><td>${c.id}</td><td><b>${c.name}</b></td><td>${c.credits}</td><td><button class="btn-secondary" onclick="setEdit('courses',${c.id})">編輯</button></td></tr>`).join('');
            } else {
                head.innerHTML = '<th>ID</th><th>名稱</th><th>管理</th>';
                body.innerHTML = paged.map(x => `<tr><td>${x.id}</td><td><b>${x.name}</b></td><td><button class="btn-secondary" onclick="setEdit('classrooms',${x.id})">編輯</button></td></tr>`).join('');
            }
            paginator.innerHTML = `<button class="btn-secondary" onclick="changePage(-1)" ${currentPage===1?'disabled':''}>◀</button><span>${currentPage} / ${totalPages}</span><button class="btn-secondary" onclick="changePage(1)" ${currentPage===totalPages?'disabled':''}>▶</button>`;
        }

        function changePage(delta) { currentPage += delta; renderTable(); }

        function setEdit(type, id) {
            editingId = id; renderEditor();
            if (type === 'teachers') { 
                const t = allData.teachers.find(x=>x.id===id); 
                document.getElementById('t_name').value = t.name; 
                document.getElementById('t_is_dir').value = t.is_director.toString(); 
            } else if (type === 'courses') { 
                const c = allData.courses.find(x=>x.id===id); 
                document.getElementById('c_name').value = c.name; 
                document.getElementById('c_credits').value = c.credits; 
                document.getElementById('c_teacher').value = c.teacher_id; 
                document.getElementById('c_room').value = c.classroom_id || ""; 
                document.getElementById('c_allowed').value = c.allowed_slots || ""; 
                document.getElementById('c_fday').value = c.fixed_day || ""; 
                document.getElementById('c_fslot').value = c.fixed_slot || "";
                document.getElementById('c_should_schedule').checked = c.should_schedule;
                document.getElementById('c_reserved_label').style.display = c.is_reserved ? 'inline' : 'none';
                const cids = c.class_ids || [];
                document.querySelectorAll('input[name="c_classes"]').forEach(cb => cb.checked = cids.includes(parseInt(cb.value)));
            } else {
                const x = (type === 'classrooms' ? allData.classrooms : allData.class_groups).find(i=>i.id===id);
                document.getElementById(type === 'classrooms' ? 'r_name' : 'g_name').value = x.name;
            }
        }

        async function saveItem(tab) {
            let payload, endpoint;
            if (tab === 'teachers') { payload = { name: document.getElementById('t_name').value, is_director: document.getElementById('t_is_dir').value === 'true' }; endpoint = 'teachers'; }
            else if (tab === 'courses') { 
                payload = { 
                    name: document.getElementById('c_name').value, 
                    credits: parseInt(document.getElementById('c_credits').value), 
                    teacher_id: parseInt(document.getElementById('c_teacher').value), 
                    class_ids: Array.from(document.querySelectorAll('input[name="c_classes"]:checked')).map(cb => parseInt(cb.value)), 
                    classroom_id: document.getElementById('c_room').value ? parseInt(document.getElementById('c_room').value) : null, 
                    allowed_slots: document.getElementById('c_allowed').value, 
                    fixed_day: document.getElementById('c_fday').value ? parseInt(document.getElementById('c_fday').value) : null, 
                    fixed_slot: document.getElementById('c_fslot').value ? parseInt(document.getElementById('c_fslot').value) : null,
                    should_schedule: document.getElementById('c_should_schedule').checked
                }; endpoint = 'courses'; 
            }
            else { payload = { name: document.getElementById(tab === 'classrooms' ? 'r_name' : 'g_name').value }; endpoint = (tab === 'classrooms' ? 'classrooms' : 'class_groups'); }
            
            await fetch(`/api/${endpoint}` + (editingId ? `/${editingId}` : ''), { method: editingId ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            fetchData(); switchTab(tab);
        }

        async function saveSettings() {
            const payload = { thursday_afternoon_off: document.getElementById('r_thurs').value === 'true', friday_all_day_off: document.getElementById('r_fri').value === 'true', afternoon_force_start_slot5: false, ge_zone_day: parseInt(document.getElementById('r_ge_day').value)-1, ge_zone_slots: document.getElementById('r_ge_slots').value, labor_slots: '1,8', director_off_day: 1, director_off_slots: document.getElementById('r_dir_slots').value, midweek_limit_enabled: document.getElementById('r_mid_en').value === 'true', midweek_allowed_slots: '2,3,4,5,6,7' };
            await fetch('/course-api/settings', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            alert("規則已更新"); fetchData();
        }

        function selectClass(name) { viewMode = 'class'; currentClass = name; currentTeacher = null; updatePrintTitle(); renderClassSelector(); renderTeacherSidebar(); renderSchedule(); }
        function selectTeacher(name) { viewMode = 'teacher'; currentTeacher = name; updatePrintTitle(); renderClassSelector(); renderTeacherSidebar(); renderSchedule(); }
        function setViewMode(mode) { viewMode = mode; currentTeacher = null; updatePrintTitle(); renderClassSelector(); renderTeacherSidebar(); renderSchedule(); }

        function renderTeacherSidebar() {
            const container = document.getElementById('teacherList'); if (!container) return;
            container.innerHTML = allData.teachers.map(t => {
                const hours = allSchedules.filter(s => s.teacher_name === t.name).length;
                return `<div class="teacher-item ${currentTeacher === t.name ? 'active' : ''}" onclick="selectTeacher('${t.name}')"><span>👤 ${t.name}</span><span class="teacher-hours">${hours} 節</span></div>`;
            }).join('');
        }

        function renderClassSelector() {
            const container = document.getElementById('classSelector');
            if (viewMode !== 'class') { container.innerHTML = `<button class="btn-secondary" onclick="setViewMode('class')">🔙 返回班級視角</button>`; return; }
            container.innerHTML = allData.class_groups.map(c => `<div class="class-badge ${c.name === currentClass ? 'active' : ''}" onclick="selectClass('${c.name}')">${c.name}</div>`).join('');
        }

        function initSettings() {
            const now = new Date(); const year = now.getFullYear(); const month = now.getMonth() + 1;
            let academicYear = year - 1911; let term = (month >= 8 ? "第 1 學期" : "第 2 學期");
            if (month < 8) academicYear--;
            document.getElementById('cfg_year').value = academicYear; document.getElementById('cfg_term').value = term;
        }

        fetchData().then(async () => { 
            initSettings(); await fetchSchedule(); 
            if (!allSchedules || allSchedules.length === 0) {
                document.getElementById('scheduleContainer').innerHTML = `<div style="text-align:center; padding:100px 20px; background:white; border-radius:16px; border:2px dashed var(--border);"><h2 style="color:var(--primary);">👋 歡迎使用排課系統</h2><p style="color:var(--text-muted); font-weight:600;">請先在上方管理資料，完成後點擊「一鍵自動排課」。</p></div>`;
            }
        });
    </script>
</body>
</html>
