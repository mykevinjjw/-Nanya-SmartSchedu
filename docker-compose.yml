version: '3.8'

services:
  # 1. 資料庫服務
  db:
    image: postgres:15
    container_name: course_schedule_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: course_schedule
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. 後端 API 服務
  backend:
    build: ./backend
    container_name: course_backend
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword@db:5432/course_schedule
    # --- 加上這三行，掛載前端與資料檔案 ---
    volumes:
      - ./frontend:/app/frontend
      - ./course_summary.md:/app/course_summary.md
    # ------------------------------------------------------
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
